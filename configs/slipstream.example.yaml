# Slipstream — one pipeline per file, one file per process.
#
# Run this same file on two or more hosts pointing at the same control plane:
# whichever instance holds the lease attaches to the source, the others stand
# by. ${ENV} references are expanded at load time, so secrets stay out of the
# file.

# Defaults to <hostname>-<pid>; set it explicitly if your hostnames are not
# stable (containers with generated names are fine as-is).
instance_id: ${SLIPSTREAM_INSTANCE_ID}

# /metrics, /healthz and /readyz. Leave addr empty to serve nothing.
observability:
  addr: "127.0.0.1:9090"

control_plane:
  # A small Postgres of its own — not one of the source databases.
  dsn: ${SLIPSTREAM_CONTROL_PLANE_DSN}
  # Failover takes at most lease_ttl. Renewal must be comfortably shorter so a
  # brief control-plane hiccup does not hand the pipeline over needlessly.
  lease_ttl: 10s
  lease_renew: 3s
  # Applies the (idempotent) control-plane schema on startup.
  auto_migrate: true

# One pipeline, or several with `pipelines:` (a list of the same shape). Each
# keeps its own lease and offset, so one process can lead some and stand by for
# others.
pipeline:
  id: pg-main
  # How often the slowest sink's position is promoted to the pipeline offset
  # and acknowledged back to the source.
  commit_interval: 1s

  source:
    type: postgres          # postgres | mysql | mongodb
    # Stamped on every event as source_id and part of the sink dedupe key.
    # Changing it re-delivers everything.
    id: pg-main
    postgres:
      # Needs the replication privilege and wal_level = logical.
      dsn: ${SLIPSTREAM_SOURCE_DSN}
      # Created on first run and reused forever after; this is what makes
      # resume possible. Drop it by hand if you retire the pipeline, or it
      # will pin WAL indefinitely.
      slot: slipstream_pg_main
      publication: slipstream_pg_main
      tables:
        - public.customers
        - public.orders
      # Adding a table here after the publication exists cannot be snapshotted
      # consistently, so by default the pipeline refuses to start and tells you
      # the options. Set this to capture the new table streaming-only, knowing
      # rows written before now are never delivered.
      auto_add_tables: false
      # Take a consistent initial snapshot when there is no stored offset.
      snapshot: true
      # single (default) reads every table inside one exported-snapshot
      # transaction: exact, but it holds a transaction open for the duration and
      # cannot be resumed if interrupted.
      #
      # chunked reads primary-key ranges alongside the stream, using watermarks
      # to drop rows the stream has already superseded. No long transaction, it
      # survives a restart, and it suits tables too large to read in one pass.
      # Needs PostgreSQL 14+ and a primary key on every captured table.
      snapshot_mode: single
      chunk_size: 10000

    # MySQL: needs binlog_format=ROW, binlog_row_image=FULL and gtid_mode=ON;
    # the reader refuses to start otherwise rather than emit partial events.
    # mysql:
    #   dsn: ${SLIPSTREAM_MYSQL_DSN}      # slip:pass@tcp(host:3306)/app
    #   server_id: 1001                   # must be unique across the topology
    #   tables: [app.customers, app.orders]
    #   snapshot: true

    # MongoDB: needs a replica set or sharded cluster for change streams.
    # mongodb:
    #   uri: ${SLIPSTREAM_MONGO_URI}      # mongodb://host:27017/?replicaSet=rs0
    #   database: app
    #   collections: [customers, orders]
    #   snapshot: true

  sinks:
    # Sinks progress independently: a slow one never blocks a fast one beyond
    # its own queue, and the pipeline offset follows the slowest.
    - name: mirror
      type: pgupsert
      queue_size: 8192
      batch_max_events: 500
      batch_max_wait: 200ms
      # retry (default) never drops anything but lets one permanently rejected
      # event stall this sink. dead_letter gives up after max_attempts and parks
      # the offending events in the control plane's dead_letters table, so the
      # rest of the stream keeps flowing.
      on_failure: retry
      pgupsert:
        dsn: ${SLIPSTREAM_MIRROR_DSN}
        # Key columns per table. Without them the sink refuses to write,
        # because an upsert with no key duplicates rows on every replay.
        keys:
          public.customers: [id]
          public.orders: [id]
        # Keep deleted rows and stamp them instead of removing them.
        soft_delete: false

    - name: hook
      type: webhook
      batch_max_events: 200
      on_failure: dead_letter
      max_attempts: 10
      webhook:
        url: ${SLIPSTREAM_WEBHOOK_URL}
        timeout: 30s
        headers:
          Authorization: Bearer ${SLIPSTREAM_WEBHOOK_TOKEN}

    # Any language can be a sink: the program reads one JSON batch per line on
    # stdin and answers {"ok":true} or {"ok":false,"error":"..."} per line. A
    # rejected batch is retried under this sink's failure policy, and a retry
    # carries the same batch_id so the program can spot the replay.
    # - name: custom
    #   type: process
    #   process:
    #     command: [python3, /opt/sinks/warehouse.py]
    #     timeout: 60s
    #     restart_on_error: true

    # NATS with JetStream: publishes are acknowledged, and the event's
    # idempotency key is sent as Nats-Msg-Id so the server drops replays inside
    # the stream's duplicate window. core_only: true skips JetStream and gives
    # up that guarantee.
    # - name: bus
    #   type: nats
    #   encoding: json          # or protobuf, for nats/kafka/process sinks
    #   nats:
    #     url: nats://127.0.0.1:4222
    #     subject_prefix: cdc
    #     ack_wait: 30s

    # Kafka: keys make each row stick to one partition, so changes to a row stay
    # ordered. Without keys a whole table shares one partition.
    # - name: topics
    #   type: kafka
    #   kafka:
    #     brokers: [127.0.0.1:9092]
    #     topic_prefix: cdc
    #     keys:
    #       public.customers: [id]

    # Handy while bringing a pipeline up; JSON lines on stdout.
    # - name: debug
    #   type: stdout
