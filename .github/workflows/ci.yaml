name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

      # Integration tests skip themselves without their DSN variables, so this
      # job stays fast and dependency-free.
      - name: unit tests
        run: go test ./... -count=1

  integration:
    name: integration tests and failover checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # A service container cannot take server flags, and logical replication
      # needs wal_level=logical, so the server is started directly.
      - name: start postgres with logical WAL
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16 \
            -c wal_level=logical \
            -c max_replication_slots=10 \
            -c max_wal_senders=10
          # Wait over TCP, not the unix socket: during initialisation the
          # entrypoint runs a temporary server on the socket only, so a socket
          # check reports ready and the next command then races its shutdown.
          for _ in $(seq 1 90); do
            if docker exec pg pg_isready -h 127.0.0.1 -U postgres -q; then break; fi
            sleep 1
          done
          docker exec pg psql -h 127.0.0.1 -U postgres -c 'SELECT 1' >/dev/null
          for db in app mirror slipstream_cp; do
            docker exec pg createdb -h 127.0.0.1 -U postgres "$db"
          done

      # MySQL needs ROW binlog and GTID mode, which a service container cannot
      # be given, so it is started directly like Postgres.
      - name: start mysql with row binlog and gtids
        run: |
          docker run -d --name my -p 3306:3306 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=1 \
            -e MYSQL_DATABASE=app \
            mysql:8 \
            --server-id=1 --log-bin=binlog --binlog-format=ROW \
            --binlog-row-image=FULL --gtid-mode=ON --enforce-gtid-consistency=ON
          # Same reasoning as Postgres: the entrypoint's temporary server is
          # reachable over the socket long before the real one accepts TCP.
          for _ in $(seq 1 90); do
            if docker exec my mysql -h 127.0.0.1 -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec my mysql -h 127.0.0.1 -e 'SELECT 1' >/dev/null
          docker exec my mysql -h 127.0.0.1 -e "CREATE USER IF NOT EXISTS 'slip'@'%' IDENTIFIED BY 'slip';
                                   GRANT ALL ON *.* TO 'slip'@'%'; FLUSH PRIVILEGES;"

      # Change streams need a replica set; a standalone mongod has none.
      - name: start mongodb as a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          # A replica set is only usable once a primary has been elected.
          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true

      - name: install psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      # A JetStream server, so the NATS sink is tested against real publish
      # acknowledgements and real server-side deduplication.
      - name: start nats with jetstream
        run: |
          go install github.com/nats-io/nats-server/v2@latest
          "$(go env GOPATH)/bin/nats-server" -js -p 4222 -sd /tmp/natsdata >/tmp/nats.log 2>&1 &
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: integration tests
        env:
          SLIPSTREAM_TEST_CP_DSN: postgres://postgres@127.0.0.1:5432/slipstream_cp
          SLIPSTREAM_TEST_SOURCE_DSN: postgres://postgres@127.0.0.1:5432/app
          SLIPSTREAM_TEST_MIRROR_DSN: postgres://postgres@127.0.0.1:5432/mirror
          SLIPSTREAM_TEST_NATS_URL: nats://127.0.0.1:4222
          SLIPSTREAM_TEST_MYSQL_DSN: slip:slip@tcp(127.0.0.1:3306)/app
          SLIPSTREAM_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        # Keep the output so a failure can be summarised on its own, instead of
        # being buried under the server logs printed afterwards.
        run: |
          set -o pipefail
          go test ./... -count=1 -race 2>&1 | tee /tmp/test.log

      - name: failing tests
        if: failure()
        run: |
          echo "::group::failures"
          grep -E "^(--- FAIL|FAIL|ok|panic:)" /tmp/test.log || true
          echo "::endgroup::"
          echo "::group::detail"
          grep -B2 -A25 -E "^--- FAIL" /tmp/test.log | head -200 || true
          echo "::endgroup::"

      # The guarantees that only show up across a process boundary: a leader
      # killed mid-stream, and a leader killed mid-snapshot.
      - name: failover verification
        env:
          CP_DSN: postgres://postgres@127.0.0.1:5432/slipstream_cp
          SRC_DSN: postgres://postgres@127.0.0.1:5432/app
          MIRROR_DSN: postgres://postgres@127.0.0.1:5432/mirror
        run: scripts/verify-failover.sh

      - name: snapshot crash verification
        env:
          CP_DSN: postgres://postgres@127.0.0.1:5432/slipstream_cp
          SRC_DSN: postgres://postgres@127.0.0.1:5432/app
          MIRROR_DSN: postgres://postgres@127.0.0.1:5432/mirror
        run: scripts/verify-snapshot-crash.sh

      - name: server logs on failure
        if: failure()
        run: |
          docker logs pg 2>&1 | tail -15
          docker logs my 2>&1 | tail -10
          docker logs mongo 2>&1 | tail -10
          tail -10 /tmp/nats.log || true
